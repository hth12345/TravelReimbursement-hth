# ELK 日志系统编排
# 命令：docker compose -f docker-compose-elk.yml up -d
version: '3.9'
services:
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: travel-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - elk-net

  logstash:
    image: logstash:8.11.0
    container_name: travel-logstash
    environment:
      TZ: Asia/Shanghai
    ports:
      - "4560:4560"
      - "5044:5044"
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-net

  kibana:
    image: kibana:8.11.0
    container_name: travel-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TZ: Asia/Shanghai
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-net

volumes:
  es-data:

networks:
  elk-net:
    driver: bridge
