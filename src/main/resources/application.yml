server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 16379
      timeout: 3000ms
  cache:
    type: redis
    redis:
      time-to-live: 86400000  # 24小时
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:13306/travelreimbursement?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USERNAME:admin}
    password: ${MQ_PASSWORD:admin}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

# Mybatis-Plus配置（适配Spring Boot3.x）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.shengyi.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      update-strategy: NOT_NULL  # 默认策略：忽略null字段
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # log-impl 已迁移到 logback-spring.xml 统一管理
